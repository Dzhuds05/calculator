<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linear Equation Solver</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --accent: #c8f060;
    --accent2: #60c8f0;
    --text: #e8e8e0;
    --text-dim: #888880;
    --text-muted: #555550;
    --error: #f06060;
    --success: #60f0a0;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 80px;
    position: relative;
    overflow-x: hidden;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(200,240,96,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 860px;
  }

  header {
    margin-bottom: 52px;
    animation: fadeSlideDown 0.6s ease both;
  }

  .tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(200,240,96,0.3);
    padding: 3px 10px;
    border-radius: 100px;
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: clamp(36px, 6vw, 60px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .subtitle {
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
    animation: fadeSlideDown 0.6s 0.1s ease both;
    flex-wrap: wrap;
  }

  .control-label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .stepper {
    display: flex;
    align-items: center;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .stepper button {
    background: var(--surface);
    border: none;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    width: 36px;
    height: 36px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    display: flex; align-items: center; justify-content: center;
  }

  .stepper button:hover { background: var(--surface2); color: var(--accent); }

  .stepper-val {
    background: var(--surface2);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    padding: 0 16px;
    height: 36px;
    display: flex; align-items: center;
    font-size: 14px;
    min-width: 48px;
    justify-content: center;
    color: var(--text);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 20px;
    height: 36px;
    border-radius: var(--radius);
    border: none;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-primary {
    background: var(--accent);
    color: #0d0d0d;
    font-weight: 500;
  }
  .btn-primary:hover { background: #d8ff6a; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }

  .btn-ghost {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--text-muted); color: var(--text); }

  /* System grid */
  .system-label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 12px;
    animation: fadeSlideDown 0.6s 0.15s ease both;
  }

  .equations-wrapper {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    animation: fadeSlideDown 0.6s 0.2s ease both;
    margin-bottom: 20px;
  }

  .equations-header {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    gap: 8px;
  }

  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-red { background: #f06060; }
  .dot-yellow { background: #f0c060; }
  .dot-green { background: var(--accent); }

  .equations-title {
    font-size: 11px;
    color: var(--text-muted);
    margin-left: 4px;
    letter-spacing: 0.1em;
  }

  #equations-grid {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .equation-row {
    display: flex;
    align-items: center;
    gap: 0;
    animation: fadeIn 0.25s ease both;
  }

  .eq-index {
    font-size: 11px;
    color: var(--text-muted);
    width: 24px;
    flex-shrink: 0;
    text-align: right;
    margin-right: 12px;
    font-style: italic;
  }

  .eq-terms {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
  }

  .term-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .coeff-input {
    width: 64px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    padding: 6px 10px;
    text-align: center;
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
  }

  .coeff-input:focus {
    border-color: rgba(200,240,96,0.5);
    box-shadow: 0 0 0 3px rgba(200,240,96,0.08);
  }

  .coeff-input.invalid {
    border-color: var(--error);
    box-shadow: 0 0 0 3px rgba(240,96,96,0.08);
  }

  .var-label {
    font-size: 14px;
    color: var(--accent2);
    font-style: italic;
    min-width: 16px;
  }

  .op-sign {
    font-size: 16px;
    color: var(--text-muted);
    padding: 0 2px;
  }

  .eq-sign {
    font-size: 16px;
    color: var(--text-muted);
    padding: 0 8px;
  }

  .rhs-input {
    width: 72px;
    background: var(--surface2);
    border: 1px solid rgba(200,240,96,0.2);
    border-radius: 6px;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    padding: 6px 10px;
    text-align: center;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .rhs-input:focus {
    border-color: rgba(200,240,96,0.6);
    box-shadow: 0 0 0 3px rgba(200,240,96,0.08);
  }

  /* Result panel */
  #result-panel {
    display: none;
    animation: fadeSlideUp 0.4s ease both;
  }

  .result-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  .result-status {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 6px var(--success);
    animation: pulse 2s infinite;
  }

  .status-dot.error { background: var(--error); box-shadow: 0 0 6px var(--error); animation: none; }
  .status-dot.warn { background: #f0c060; box-shadow: 0 0 6px #f0c060; animation: none; }

  .result-body {
    padding: 24px 20px;
  }

  .solution-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }

  .solution-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    text-align: center;
    animation: popIn 0.3s ease both;
  }

  .solution-var {
    font-size: 13px;
    color: var(--accent2);
    font-style: italic;
    margin-bottom: 6px;
  }

  .solution-val {
    font-size: 22px;
    color: var(--text);
    font-weight: 500;
    letter-spacing: -0.02em;
  }

  .solution-fraction {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .error-msg {
    color: var(--error);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .info-msg {
    color: #f0c060;
    font-size: 13px;
  }

  /* Steps toggle */
  .steps-toggle {
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    cursor: pointer;
    text-transform: uppercase;
    transition: color 0.15s;
    display: flex; align-items: center; gap: 6px;
  }
  .steps-toggle:hover { color: var(--text); }
  .steps-toggle svg { transition: transform 0.2s; }
  .steps-toggle.open svg { transform: rotate(180deg); }

  #steps-panel {
    display: none;
    border-top: 1px solid var(--border);
    padding: 20px;
  }

  .step-item {
    display: flex;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    animation: fadeIn 0.2s ease both;
  }
  .step-item:last-child { border-bottom: none; }

  .step-num {
    font-size: 10px;
    color: var(--text-muted);
    min-width: 20px;
    margin-top: 2px;
  }

  .step-content {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  .step-matrix {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    border-radius: 6px;
    padding: 8px 12px;
    display: inline-block;
  }

  /* Footer */
  footer {
    margin-top: 60px;
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    position: relative;
    z-index: 1;
    animation: fadeIn 0.6s 0.4s ease both;
  }

  /* Animations */
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Responsive */
  @media (max-width: 600px) {
    .eq-terms { gap: 4px; }
    .coeff-input { width: 52px; font-size: 13px; }
    .rhs-input { width: 60px; font-size: 13px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="tag">Math Tool</div>
    <h1>Linear <em>Equation</em><br>Solver</h1>
    <p class="subtitle">Gaussian elimination · up to 8 variables · step-by-step</p>
  </header>

  <div class="controls">
    <span class="control-label">Variables</span>
    <div class="stepper">
      <button onclick="changeSize(-1)" aria-label="Decrease">−</button>
      <div class="stepper-val" id="size-display">3</div>
      <button onclick="changeSize(1)" aria-label="Increase">+</button>
    </div>
    <button class="btn btn-primary" onclick="solve()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      Solve
    </button>
    <button class="btn btn-ghost" onclick="clearAll()">Clear</button>
    <button class="btn btn-ghost" onclick="loadExample()">Example</button>
  </div>

  <div class="system-label">System of equations</div>

  <div class="equations-wrapper">
    <div class="equations-header">
      <div class="dot dot-red"></div>
      <div class="dot dot-yellow"></div>
      <div class="dot dot-green"></div>
      <span class="equations-title">linear-system.eq</span>
    </div>
    <div id="equations-grid"></div>
  </div>

  <div id="result-panel">
    <div class="result-box">
      <div class="result-header">
        <div class="result-status" id="result-status">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text">Solution found</span>
        </div>
        <button class="steps-toggle" id="steps-toggle" onclick="toggleSteps()">
          Steps
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>
      <div class="result-body" id="result-body"></div>
      <div id="steps-panel">
        <div id="steps-content"></div>
      </div>
    </div>
  </div>
</div>

<footer>Built with Gaussian elimination &nbsp;·&nbsp; No dependencies</footer>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let n = 3;
const VAR_NAMES = ['x', 'y', 'z', 'w', 'u', 'v', 'p', 'q'];
let lastSteps = [];

// ── Build UI ───────────────────────────────────────────────────────────────
function buildGrid() {
  const grid = document.getElementById('equations-grid');
  grid.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const row = document.createElement('div');
    row.className = 'equation-row';
    row.innerHTML = `<div class="eq-index">e${i+1}</div><div class="eq-terms" id="terms-${i}"></div>`;
    grid.appendChild(row);
    buildTerms(i);
  }
}

function buildTerms(row) {
  const terms = document.getElementById(`terms-${row}`);
  terms.innerHTML = '';
  for (let j = 0; j < n; j++) {
    const tg = document.createElement('div');
    tg.className = 'term-group';
    if (j > 0) tg.innerHTML = `<span class="op-sign">+</span>`;
    tg.innerHTML += `
      <input class="coeff-input" id="c-${row}-${j}" type="text" value="0"
        placeholder="0" autocomplete="off" spellcheck="false"
        oninput="validateInput(this)">
      <span class="var-label"><i>${VAR_NAMES[j]}</i></span>`;
    terms.appendChild(tg);
  }
  terms.innerHTML += `<span class="eq-sign">=</span>
    <input class="rhs-input" id="r-${row}" type="text" value="0"
      placeholder="0" autocomplete="off" spellcheck="false"
      oninput="validateInput(this)">`;
}

function validateInput(el) {
  const v = el.value.trim();
  const ok = v === '' || v === '-' || !isNaN(parseFloat(v));
  el.classList.toggle('invalid', !ok);
}

// ── Controls ───────────────────────────────────────────────────────────────
function changeSize(delta) {
  n = Math.max(2, Math.min(8, n + delta));
  document.getElementById('size-display').textContent = n;
  buildGrid();
  document.getElementById('result-panel').style.display = 'none';
}

function clearAll() {
  document.querySelectorAll('.coeff-input, .rhs-input').forEach(el => {
    el.value = '0'; el.classList.remove('invalid');
  });
  document.getElementById('result-panel').style.display = 'none';
}

function loadExample() {
  const examples = [
    { n: 2, coeffs: [[2,1],[1,-1]], rhs: [5, 1] },
    { n: 3, coeffs: [[2,1,-1],[1,3,2],[1,-1,3]], rhs: [8,18,-2] },
    { n: 4, coeffs: [[2,1,0,0],[1,3,1,0],[0,1,4,1],[0,0,1,2]], rhs: [3,8,15,9] },
  ];
  const ex = n <= 2 ? examples[0] : n === 3 ? examples[1] : examples[2];
  n = ex.n;
  document.getElementById('size-display').textContent = n;
  buildGrid();
  ex.coeffs.forEach((row, i) => row.forEach((v, j) => {
    document.getElementById(`c-${i}-${j}`).value = v;
  }));
  ex.rhs.forEach((v, i) => { document.getElementById(`r-${i}`).value = v; });
  document.getElementById('result-panel').style.display = 'none';
}

// ── Solver ─────────────────────────────────────────────────────────────────
function gcd(a, b) { a = Math.abs(Math.round(a)); b = Math.abs(Math.round(b)); while (b) { [a,b]=[b,a%b]; } return a; }

function toFraction(val) {
  if (Math.abs(val) < 1e-9) return '0';
  if (Math.abs(val - Math.round(val)) < 1e-9) return String(Math.round(val));
  const sign = val < 0 ? '-' : '';
  val = Math.abs(val);
  const denom = 1e6;
  const numer = Math.round(val * denom);
  const d = gcd(numer, denom);
  return `${sign}${numer/d}/${denom/d}`;
}

function formatVal(val) {
  if (Math.abs(val - Math.round(val)) < 1e-9) return String(Math.round(val));
  return val.toFixed(6).replace(/\.?0+$/, '');
}

function matrixStr(mat) {
  return mat.map(row => '[ ' + row.map(v => formatVal(v).padStart(8)).join('  ') + ' ]').join('\n');
}

function solve() {
  // Read inputs
  const A = [], b = [];
  let hasInvalid = false;
  for (let i = 0; i < n; i++) {
    A.push([]);
    for (let j = 0; j < n; j++) {
      const el = document.getElementById(`c-${i}-${j}`);
      const v = parseFloat(el.value);
      if (isNaN(v)) { el.classList.add('invalid'); hasInvalid = true; } else el.classList.remove('invalid');
      A[i].push(v || 0);
    }
    const rel = document.getElementById(`r-${i}`);
    const rv = parseFloat(rel.value);
    if (isNaN(rv)) { rel.classList.add('invalid'); hasInvalid = true; } else rel.classList.remove('invalid');
    b.push(rv || 0);
  }
  if (hasInvalid) return;

  // Augmented matrix
  let mat = A.map((row, i) => [...row, b[i]]);
  const steps = [];

  // Forward elimination (partial pivot)
  for (let col = 0; col < n; col++) {
    // Find pivot
    let maxRow = col;
    for (let row = col+1; row < n; row++)
      if (Math.abs(mat[row][col]) > Math.abs(mat[maxRow][col])) maxRow = row;

    if (maxRow !== col) {
      [mat[col], mat[maxRow]] = [mat[maxRow], mat[col]];
      steps.push({ desc: `Swap row ${col+1} ↔ row ${maxRow+1}`, mat: mat.map(r=>[...r]) });
    }

    const pivot = mat[col][col];
    if (Math.abs(pivot) < 1e-12) continue;

    for (let row = col+1; row < n; row++) {
      const factor = mat[row][col] / pivot;
      if (Math.abs(factor) < 1e-12) continue;
      for (let k = col; k <= n; k++)
        mat[row][k] -= factor * mat[col][k];
      steps.push({
        desc: `R${row+1} ← R${row+1} − (${toFraction(factor)}) × R${col+1}`,
        mat: mat.map(r=>[...r])
      });
    }
  }

  // Check solvability
  let consistent = true, infiniteSolutions = false;
  for (let i = 0; i < n; i++) {
    const rowAllZero = Math.abs(mat[i].slice(0,n).reduce((s,v)=>s+Math.abs(v),0)) < 1e-9;
    if (rowAllZero && Math.abs(mat[i][n]) > 1e-9) { consistent = false; break; }
    if (rowAllZero && Math.abs(mat[i][n]) < 1e-9) infiniteSolutions = true;
  }

  // Back substitution
  const x = new Array(n).fill(0);
  if (consistent && !infiniteSolutions) {
    for (let i = n-1; i >= 0; i--) {
      x[i] = mat[i][n];
      for (let j = i+1; j < n; j++) x[i] -= mat[i][j] * x[j];
      const denom = mat[i][i];
      if (Math.abs(denom) > 1e-12) x[i] /= denom;
    }
    steps.push({ desc: 'Back-substitution complete', mat: null });
  }

  lastSteps = steps;
  showResult(consistent, infiniteSolutions, x);
}

function showResult(consistent, infinite, x) {
  const panel = document.getElementById('result-panel');
  const body = document.getElementById('result-body');
  const statusText = document.getElementById('status-text');
  const statusDot = document.getElementById('status-dot');

  panel.style.display = 'block';

  if (!consistent) {
    statusDot.className = 'status-dot error';
    statusText.textContent = 'No solution';
    body.innerHTML = `<div class="error-msg">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      The system is inconsistent — no solution exists.
    </div>`;
  } else if (infinite) {
    statusDot.className = 'status-dot warn';
    statusText.textContent = 'Infinite solutions';
    body.innerHTML = `<div class="info-msg">The system has infinitely many solutions (dependent equations).</div>`;
  } else {
    statusDot.className = 'status-dot';
    statusText.textContent = 'Unique solution found';
    const cards = x.map((val, i) => {
      const frac = toFraction(val);
      const dec = formatVal(val);
      const showFrac = frac !== dec && frac !== '0' && !frac.includes('e');
      return `<div class="solution-card" style="animation-delay:${i*0.05}s">
        <div class="solution-var"><i>${VAR_NAMES[i]}</i></div>
        <div class="solution-val">${dec}</div>
        ${showFrac ? `<div class="solution-fraction">${frac}</div>` : ''}
      </div>`;
    }).join('');
    body.innerHTML = `<div class="solution-grid">${cards}</div>`;
  }

  renderSteps();
  document.getElementById('steps-panel').style.display = 'none';
  const tog = document.getElementById('steps-toggle');
  tog.classList.remove('open');
}

function renderSteps() {
  const sc = document.getElementById('steps-content');
  sc.innerHTML = lastSteps.map((s, i) => `
    <div class="step-item" style="animation-delay:${i*0.04}s">
      <div class="step-num">${i+1}</div>
      <div class="step-content">
        ${s.desc}
        ${s.mat ? `<div class="step-matrix">${matrixStr(s.mat)}</div>` : ''}
      </div>
    </div>`).join('');
}

function toggleSteps() {
  const panel = document.getElementById('steps-panel');
  const tog = document.getElementById('steps-toggle');
  const open = panel.style.display === 'block';
  panel.style.display = open ? 'none' : 'block';
  tog.classList.toggle('open', !open);
}

// ── Init ───────────────────────────────────────────────────────────────────
buildGrid();
loadExample();

// Keyboard shortcut: Enter to solve
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) solve();
});
</script>
</body>
</html>
